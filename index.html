<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: #202124; }
    .header { display: flex; justify-content: space-between; align-items: flex-end; padding: 8px 8px 0 8px; background: #171717; }
    .tabs { display: flex; flex-wrap: nowrap; overflow-x: auto; flex: 1; align-items: flex-end;}
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; padding: 8px 15px; cursor: pointer; color: #9aa0a6; background: #292a2d; border-radius: 8px 8px 0 0; margin-right: 4px; font-size: 13px; max-width: 150px; min-width: 80px; white-space: nowrap; overflow: hidden; }
    .tab:hover { background: #3c4043; color: white; }
    .tab.active { background: #323639; color: white; }
    .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .close-btn { margin-left: 8px; font-weight: bold; border-radius: 50%; padding: 2px 6px; }
    .close-btn:hover { background: #5f6368; color: white; }
    .add-tab-btn { padding: 8px 12px; cursor: pointer; color: #9aa0a6; font-size: 16px; font-weight: bold; }
    .add-tab-btn:hover { color: white; }
    .controls { color: #9aa0a6; font-size: 12px; display: flex; align-items: center; padding-bottom: 8px; margin-left: 15px; }
    input[type=range] { margin-left: 8px; cursor: pointer; width: 80px; }
    .nav-bar { display: flex; padding: 8px; background: #323639; align-items: center; }
    .url-input { flex: 1; padding: 6px 12px; border-radius: 16px; border: none; background: #202124; color: white; font-size: 14px; outline: none; }
    .url-input:focus { background: #171717; border: 1px solid #8ab4f8; }
    .views { flex: 1; position: relative; background: white; }
    webview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    webview.active { display: flex; }
  </style>
</head>
<body>
  <div class="header">
    <div class="tabs" id="tab-bar">
      <div class="add-tab-btn" id="add-tab-btn" onclick="addTab()">+</div>
    </div>
    <div class="controls">
      <label>Opacity:</label>
      <input type="range" min="0.1" max="1.0" step="0.05" value="1.0" oninput="changeOpacity(this.value)">
    </div>
  </div>
  <div class="nav-bar">
    <input type="text" id="url-input" class="url-input" placeholder="Enter URL or search..." onkeydown="handleEnter(event)">
  </div>
  <div class="views" id="views"></div>

  <script>
    const { ipcRenderer } = require('electron');
    let tabCount = 0;

    function addTab(url = 'https://duckduckgo.com') {
      tabCount++;
      const tabId = 'tab-' + tabCount;
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.dataset.target = tabId;
      tab.onclick = () => switchTab(tabId);
      tab.innerHTML = `<span class="tab-title">New Tab</span><span class="close-btn" onclick="closeTab('${tabId}', event)">×</span>`;
      document.getElementById('tab-bar').insertBefore(tab, document.getElementById('add-tab-btn'));

      const wv = document.createElement('webview');
      wv.id = tabId;
      wv.src = url;
      wv.addEventListener('did-navigate', (e) => {
        if (wv.classList.contains('active')) document.getElementById('url-input').value = e.url;
      });
      wv.addEventListener('page-title-updated', (e) => {
        const titleSpan = document.querySelector(`.tab[data-target="${tabId}"] .tab-title`);
        if (titleSpan) titleSpan.innerText = e.title;
      });

      document.getElementById('views').appendChild(wv);
      switchTab(tabId);
    }

    function switchTab(id) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('webview').forEach(v => v.classList.remove('active'));
      const activeTab = document.querySelector(`.tab[data-target="${id}"]`);
      const activeWv = document.getElementById(id);
      if (activeTab && activeWv) {
        activeTab.classList.add('active');
        activeWv.classList.add('active');
        document.getElementById('url-input').value = activeWv.getURL() || activeWv.src;
      }
    }

    function closeTab(id, event) {
      event.stopPropagation();
      const tab = document.querySelector(`.tab[data-target="${id}"]`);
      const wv = document.getElementById(id);
      if (tab.classList.contains('active')) {
        const prevTab = tab.previousElementSibling;
        if (prevTab && prevTab.classList.contains('tab')) {
          switchTab(prevTab.dataset.target);
        } else {
          document.getElementById('url-input').value = '';
        }
      }
      tab.remove();
      wv.remove();
    }

    function handleEnter(event) {
      if (event.key === 'Enter') {
        let url = document.getElementById('url-input').value;
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url; 
        const activeWv = document.querySelector('webview.active');
        if (activeWv) activeWv.src = url;
      }
    }

    function changeOpacity(value) {
      ipcRenderer.send('set-opacity', parseFloat(value));
    }
    window.onload = () => addTab();
  </script>
</body>
</html>
